name: Phase 7 SEO audit

on:
  pull_request:
  push:
    branches: [phase-7-seo-steps-4-6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Build Astro website
        run: npm run build
      - name: Audit rendered SEO metadata
        run: python3 scripts/audit-seo.py
